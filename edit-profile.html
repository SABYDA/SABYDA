
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABYDA | My Profile</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;padding:20px;background:#0b1424;color:#f4f7fc;
 font-family:Arial,sans-serif
}

.container{
 max-width:550px;margin:30px auto;background:#14243a;
 border:1px solid #29415e;border-radius:18px;padding:25px
}

h1{text-align:center;color:#55adff}
p{color:#a8b9ce;line-height:1.5}

.avatar-wrap{
 position:relative;width:116px;height:116px;margin:25px auto
}

.avatar{
 width:116px;height:116px;border-radius:50%;
 background:#263f5c;display:flex;align-items:center;
 justify-content:center;overflow:hidden;font-size:35px;color:#70baff
}

.avatar img{width:100%;height:100%;object-fit:cover}

.add-photo{
 position:absolute;right:0;bottom:0;
 width:38px;height:38px;border-radius:50%;
 border:3px solid #14243a;background:#55adff;
 color:#071525;font-size:27px;font-weight:bold;
 display:flex;align-items:center;justify-content:center;
 cursor:pointer;margin:0;padding:0
}

label{display:block;margin:20px 0 7px;font-size:14px}

input[type="text"],input[type="email"],textarea{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #38516e;background:#0b1424;
 color:white;font-size:15px
}

textarea{min-height:95px;resize:vertical}

button{
 width:100%;padding:14px;margin-top:15px;
 border:0;border-radius:9px;background:#55adff;
 color:#071525;font-weight:bold;font-size:14px;cursor:pointer
}

button:disabled{opacity:.6;cursor:not-allowed}

.logout{background:#263f5c;color:white}

.message{text-align:center;overflow-wrap:anywhere}

a{color:#70baff;text-decoration:none}

#photoInput{display:none}

.modal{
 display:none;position:fixed;inset:0;z-index:20;
 background:rgba(0,0,0,.88);padding:20px;
 align-items:center;justify-content:center;overflow-y:auto
}

.modal-content{
 width:100%;max-width:420px;background:#14243a;
 border:1px solid #38516e;border-radius:18px;
 padding:22px;text-align:center;margin:auto
}

.modal-content h2{color:#55adff;margin-top:0}

#cropCanvas{
 width:min(100%,320px);height:auto;
 aspect-ratio:1/1;border-radius:12px;
 background:#071525;touch-action:none;
 display:block;margin:15px auto;cursor:grab
}

#cropCanvas:active{cursor:grabbing}

.zoom-label{display:block;text-align:left;margin-top:18px}

#zoom{
 width:100%;accent-color:#55adff;margin:12px 0
}

.cancel-button{background:#263f5c;color:white}

.crop-help{font-size:13px}

</style>
</head>

<body>

<div class="container">

 <h1>♫ SABYDA</h1>
 <p style="text-align:center">My Music Profile</p>

 <div class="avatar-wrap">
  <div class="avatar" id="avatar">♫</div>
  <button type="button" class="add-photo"
   id="addPhoto" aria-label="Change profile photo">+</button>
 </div>

 <input type="file" id="photoInput" accept="image/*">

 <form id="profileForm">

  <label for="fullName">Display name</label>
  <input id="fullName" type="text" placeholder="Your name">

  <label for="username">Username</label>
  <input id="username" type="text" placeholder="Choose a username">

  <label for="bio">About me</label>
  <textarea id="bio" maxlength="300"
   placeholder="Tell the SABYDA community about yourself"></textarea>

  <label>Email address</label>
  <input id="email" type="email" readonly>

  <button type="submit" id="saveButton">Save Profile</button>
 </form>

 <p id="message" class="message"></p>

 <button class="logout" id="logoutButton">Log Out</button>

 <p style="text-align:center">
  <a href="index.html">← Back to SABYDA</a>
 </p>

</div>

<!-- PHOTO CROPPING WINDOW -->
<div class="modal" id="cropModal">
 <div class="modal-content">

  <h2>Crop your profile photo</h2>
  <p class="crop-help">
   Move the photo to position it. Use the slider to zoom in or out.
  </p>

  <canvas id="cropCanvas" width="400" height="400"></canvas>

  <label class="zoom-label" for="zoom">Zoom photo</label>
  <input type="range" id="zoom" min="1" max="3"
   step="0.01" value="1">

  <button type="button" id="uploadPhoto">
   Upload profile photo
  </button>

  <button type="button" class="cancel-button" id="cancelCrop">
   Cancel
  </button>

  <p id="cropMessage" class="message"></p>

 </div>
</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
 "https://otmgseddljgeuqetufsm.supabase.co",
 "sb_publishable_u18mA3SdsqCNZGW2bavZWA_GrRRs3YG"
);

const form = document.getElementById("profileForm");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");
const photoInput = document.getElementById("photoInput");
const cropModal = document.getElementById("cropModal");
const cropCanvas = document.getElementById("cropCanvas");
const ctx = cropCanvas.getContext("2d");
const zoomInput = document.getElementById("zoom");

let currentUser = null;
let avatarUrl = null;
let selectedImage = null;
let baseScale = 1;
let zoom = 1;
let offsetX = 0;
let offsetY = 0;
let dragging = false;
let lastX = 0;
let lastY = 0;

function showMessage(text, error = false) {
 message.textContent = text;
 message.style.color = error ? "#ff9b9b" : "#70d6a5";
}

function showCropMessage(text, error = false) {
 const area = document.getElementById("cropMessage");
 area.textContent = text;
 area.style.color = error ? "#ff9b9b" : "#70d6a5";
}

function showAvatar(url) {
 const area = document.getElementById("avatar");
 area.innerHTML = "";

 if (url) {
  const img = document.createElement("img");
  img.src = url;
  img.alt = "Profile photo";
  area.appendChild(img);
 } else {
  area.textContent = "♫";
 }
}

async function loadProfile() {
 const { data: { session }, error } =
  await supabase.auth.getSession();

 if (error || !session) {
  window.location.href = "auth.html";
  return;
 }

 currentUser = session.user;

 document.getElementById("email").value =
  currentUser.email || "";

 const { data, error: profileError } = await supabase
  .from("profiles")
  .select("*")
  .eq("id", currentUser.id)
  .single();

 if (profileError) {
  showMessage(profileError.message, true);
  return;
 }

 document.getElementById("fullName").value =
  data.full_name || "";

 document.getElementById("username").value =
  data.username || "";

 document.getElementById("bio").value =
  data.bio || "";

 avatarUrl = data.avatar_url || null;
 showAvatar(avatarUrl);
}

// OPEN PHONE PHOTO PICKER
document.getElementById("addPhoto").addEventListener("click", () => {
 photoInput.click();
});

// LOAD SELECTED PHOTO INTO CROP EDITOR
photoInput.addEventListener("change", () => {
 const file = photoInput.files[0];

 if (!file) return;

 if (!file.type.startsWith("image/")) {
  showMessage("Please select a valid image.", true);
  photoInput.value = "";
  return;
 }

 if (file.size > 10 * 1024 * 1024) {
  showMessage("Please choose a photo smaller than 10 MB.", true);
  photoInput.value = "";
  return;
 }

 const imageUrl = URL.createObjectURL(file);
 const img = new Image();

 img.onload = () => {
  if (selectedImage) {
   URL.revokeObjectURL(selectedImage.sourceUrl);
  }

  selectedImage = {
   image: img,
   sourceUrl: imageUrl
  };

  baseScale = Math.max(
   400 / img.width,
   400 / img.height
  );

  zoom = 1;
  offsetX = 0;
  offsetY = 0;
  zoomInput.value = "1";

  drawCrop();
  showCropMessage("");
  cropModal.style.display = "flex";
 };

 img.onerror = () => {
  URL.revokeObjectURL(imageUrl);
  photoInput.value = "";
  showMessage("This photo could not be opened.", true);
 };

 img.src = imageUrl;
});

function drawCrop() {
 if (!selectedImage) return;

 const img = selectedImage.image;
 const scale = baseScale * zoom;

 const width = img.width * scale;
 const height = img.height * scale;

 ctx.clearRect(0, 0, 400, 400);

 ctx.fillStyle = "#071525";
 ctx.fillRect(0, 0, 400, 400);

 ctx.drawImage(
  img,
  (400 - width) / 2 + offsetX,
  (400 - height) / 2 + offsetY,
  width,
  height
 );
}

// ZOOM
zoomInput.addEventListener("input", () => {
 zoom = Number(zoomInput.value);
 drawCrop();
});

// DRAG PHOTO TO REPOSITION
cropCanvas.addEventListener("pointerdown", event => {
 if (!selectedImage) return;

 dragging = true;
 lastX = event.clientX;
 lastY = event.clientY;

 cropCanvas.setPointerCapture(event.pointerId);
});

cropCanvas.addEventListener("pointermove", event => {
 if (!dragging) return;

 const rect = cropCanvas.getBoundingClientRect();

 const scaleX = 400 / rect.width;
 const scaleY = 400 / rect.height;

 offsetX += (event.clientX - lastX) * scaleX;
 offsetY += (event.clientY - lastY) * scaleY;

 lastX = event.clientX;
 lastY = event.clientY;

 drawCrop();
});

function stopDragging() {
 dragging = false;
}

cropCanvas.addEventListener("pointerup", stopDragging);
cropCanvas.addEventListener("pointercancel", stopDragging);

// CLOSE CROPPING WINDOW
document.getElementById("cancelCrop").addEventListener("click", () => {
 cropModal.style.display = "none";
 photoInput.value = "";
 showCropMessage("");
});

// COMPRESS CROPPED PHOTO
async function makeCroppedPhoto() {
 return new Promise((resolve, reject) => {
  cropCanvas.toBlob(blob => {
   if (!blob) {
    reject(new Error("Could not prepare your photo."));
    return;
   }

   resolve(new File(
    [blob],
    "avatar.jpg",
    { type: "image/jpeg" }
   ));
  }, "image/jpeg", 0.82);
 });
}

// UPLOAD PHOTO IMMEDIATELY
document.getElementById("uploadPhoto").addEventListener("click",
 async () => {

 if (!currentUser || !selectedImage) return;

 const uploadButton = document.getElementById("uploadPhoto");
 uploadButton.disabled = true;
 showCropMessage("Preparing your photo...");

 try {
  const compressedFile = await makeCroppedPhoto();

  const filePath = currentUser.id + "/avatar.jpg";

  showCropMessage("Uploading your profile photo...");

  const { error: uploadError } = await supabase.storage
   .from("avatars")
   .upload(filePath, compressedFile, { upsert: true });

  if (uploadError) throw uploadError;

  const { data: imageData } = supabase.storage
   .from("avatars")
   .getPublicUrl(filePath);

  const newAvatarUrl =
   imageData.publicUrl + "?v=" + Date.now();

  const { error: profileError } = await supabase
   .from("profiles")
   .update({
    avatar_url: newAvatarUrl,
    updated_at: new Date().toISOString()
   })
   .eq("id", currentUser.id);

  if (profileError) throw profileError;

  avatarUrl = newAvatarUrl;
  showAvatar(avatarUrl);

  cropModal.style.display = "none";
  photoInput.value = "";

  if (selectedImage) {
   URL.revokeObjectURL(selectedImage.sourceUrl);
   selectedImage = null;
  }

  showMessage("Your profile photo has been updated!");

 } catch (error) {
  showCropMessage(error.message, true);
 } finally {
  uploadButton.disabled = false;
 }
});

// SAVE PROFILE DETAILS
form.addEventListener("submit", async event => {
 event.preventDefault();

 if (!currentUser) return;

 saveButton.disabled = true;
 showMessage("Saving your profile...");

 try {
  const updates = {
   id: currentUser.id,
   full_name: document.getElementById("fullName").value.trim(),
   username: document.getElementById("username").value.trim(),
   bio: document.getElementById("bio").value.trim(),
   avatar_url: avatarUrl,
   updated_at: new Date().toISOString()
  };

  const { error } = await supabase
   .from("profiles")
   .upsert(updates);

  if (error) throw error;

  showMessage("Your profile details have been saved!");

 } catch (error) {
  showMessage(error.message, true);
 } finally {
  saveButton.disabled = false;
 }
});

// LOG OUT
document.getElementById("logoutButton")
 .addEventListener("click", async () => {

  const { error } = await supabase.auth.signOut();

  if (error) {
   showMessage(error.message, true);
   return;
  }

  window.location.href = "auth.html";
 });

loadProfile();

</script>

</body>
 </html>
