
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABYDA | My Profile</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#0b1424;color:#f4f7fc;
 font-family:Arial,sans-serif
}
.container{
 max-width:550px;margin:30px auto;background:#14243a;
 border:1px solid #29415e;border-radius:18px;padding:25px
}
h1{text-align:center;color:#55adff}
p{color:#a8b9ce;line-height:1.5}
.avatar{
 width:110px;height:110px;border-radius:50%;
 background:#263f5c;display:flex;align-items:center;
 justify-content:center;margin:20px auto;overflow:hidden;
 font-size:35px;color:#70baff
}
.avatar img{width:100%;height:100%;object-fit:cover}
label{display:block;margin:17px 0 7px;font-size:14px}
input,textarea{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #38516e;background:#0b1424;
 color:white;font-size:15px
}
textarea{min-height:95px;resize:vertical}
button{
 width:100%;padding:14px;margin-top:15px;
 border:0;border-radius:9px;background:#55adff;
 color:#071525;font-weight:bold;font-size:14px
}
button:disabled{opacity:.6}
.logout{background:#263f5c;color:white}
.message{text-align:center;overflow-wrap:anywhere}
a{color:#70baff;text-decoration:none}
.hint{font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="container">
 <h1>♫ SABYDA</h1>
 <p style="text-align:center">My Music Profile</p>

 <div class="avatar" id="avatar">♫</div>

 <form id="profileForm">
  <label for="photo">Profile photo</label>
  <input type="file" id="photo" accept="image/*">
  <p class="hint">Choose a photo up to 10 MB. SABYDA will automatically resize and compress it.</p>

  <label for="fullName">Display name</label>
  <input id="fullName" type="text" placeholder="Your name">

  <label for="username">Username</label>
  <input id="username" type="text" placeholder="Choose a username">

  <label for="bio">About me</label>
  <textarea id="bio" maxlength="300"
   placeholder="Tell the SABYDA community about yourself"></textarea>

  <label>Email address</label>
  <input id="email" type="email" readonly>

  <button type="submit" id="saveButton">Save Profile</button>
 </form>

 <p id="message" class="message"></p>

 <button class="logout" id="logoutButton">Log Out</button>

 <p style="text-align:center">
  <a href="index.html">← Back to SABYDA</a>
 </p>
</div>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
 "https://otmgseddljgeuqetufsm.supabase.co",
 "sb_publishable_u18mA3SdsqCNZGW2bavZWA_GrRRs3YG"
);

const form = document.getElementById("profileForm");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");
const photoInput = document.getElementById("photo");

let currentUser = null;
let avatarUrl = null;

function showMessage(text, error = false) {
 message.textContent = text;
 message.style.color = error ? "#ff9b9b" : "#70d6a5";
}

function showAvatar(url) {
 const area = document.getElementById("avatar");
 area.innerHTML = "";

 if (url) {
  const img = document.createElement("img");
  img.src = url;
  img.alt = "Profile photo";
  area.appendChild(img);
 } else {
  area.textContent = "♫";
 }
}

async function compressPhoto(file) {
 if (!file.type.startsWith("image/")) {
  throw new Error("Please choose a valid image.");
 }

 if (file.size > 10 * 1024 * 1024) {
  throw new Error("Please choose a photo smaller than 10 MB.");
 }

 const imageUrl = URL.createObjectURL(file);

 try {
  const img = new Image();

  await new Promise((resolve, reject) => {
   img.onload = resolve;
   img.onerror = () => reject(
    new Error("This photo could not be opened. Please choose another.")
   );
   img.src = imageUrl;
  });

  const side = 400;
  const canvas = document.createElement("canvas");
  canvas.width = side;
  canvas.height = side;

  const ctx = canvas.getContext("2d");

  if (!ctx) {
   throw new Error("Photo processing is not supported by this browser.");
  }

  const cropSize = Math.min(img.width, img.height);
  const cropX = (img.width - cropSize) / 2;
  const cropY = (img.height - cropSize) / 2;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, side, side);

  ctx.drawImage(
   img,
   cropX, cropY, cropSize, cropSize,
   0, 0, side, side
  );

  let quality = 0.85;

  let blob = await new Promise(resolve =>
   canvas.toBlob(resolve, "image/jpeg", quality)
  );

  while (blob && blob.size > 500 * 1024 && quality > 0.45) {
   quality -= 0.1;
   blob = await new Promise(resolve =>
    canvas.toBlob(resolve, "image/jpeg", quality)
   );
  }

  if (!blob) {
   throw new Error("Could not compress this photo. Please try another.");
  }

  return new File(
   [blob],
   "avatar.jpg",
   { type: "image/jpeg" }
  );

 } finally {
  URL.revokeObjectURL(imageUrl);
 }
}

async function loadProfile() {
 const { data: { session }, error } =
  await supabase.auth.getSession();

 if (error || !session) {
  window.location.href = "auth.html";
  return;
 }

 currentUser = session.user;
 document.getElementById("email").value =
  currentUser.email || "";

 const { data, error: profileError } = await supabase
  .from("profiles")
  .select("*")
  .eq("id", currentUser.id)
  .single();

 if (profileError) {
  showMessage(profileError.message, true);
  return;
 }

 document.getElementById("fullName").value =
  data.full_name || "";

 document.getElementById("username").value =
  data.username || "";

 document.getElementById("bio").value =
  data.bio || "";

 avatarUrl = data.avatar_url || null;
 showAvatar(avatarUrl);
}

form.addEventListener("submit", async (event) => {
 event.preventDefault();

 if (!currentUser) return;

 saveButton.disabled = true;
 showMessage("Saving your profile...");

 try {
  const file = photoInput.files[0];

  if (file) {
   showMessage("Preparing your photo...");

   const compressedFile = await compressPhoto(file);
   const filePath = currentUser.id + "/avatar.jpg";

   showMessage("Uploading your profile photo...");

   const { error: uploadError } = await supabase.storage
    .from("avatars")
    .upload(filePath, compressedFile, { upsert: true });

   if (uploadError) throw uploadError;

   const { data: imageData } = supabase.storage
    .from("avatars")
    .getPublicUrl(filePath);

   avatarUrl = imageData.publicUrl;
  }

  const updates = {
   id: currentUser.id,
   full_name: document.getElementById("fullName").value.trim(),
   username: document.getElementById("username").value.trim(),
   bio: document.getElementById("bio").value.trim(),
   avatar_url: avatarUrl,
   updated_at: new Date().toISOString()
  };

  const { error } = await supabase
   .from("profiles")
   .upsert(updates);

  if (error) throw error;

  showAvatar(avatarUrl);
  photoInput.value = "";
  showMessage("Your profile has been saved!");

 } catch (error) {
  showMessage(error.message, true);
 } finally {
  saveButton.disabled = false;
 }
});

document.getElementById("logoutButton")
 .addEventListener("click", async () => {
  const { error } = await supabase.auth.signOut();

  if (error) {
   showMessage(error.message, true);
   return;
  }

  window.location.href = "auth.html";
 });

loadProfile();
</script>
</body>
</html>
