
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c30">
<title>Music Polls | SABYDA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1424;color:#f4f7fc;
 font-family:Arial,sans-serif
}
header{background:#101c30;padding:20px}
header a{color:#70baff;text-decoration:none}
main{max-width:850px;margin:auto;padding:20px}
.hero{
 background:linear-gradient(135deg,#183c61,#14243a);
 padding:30px 22px;border-radius:18px;margin-top:20px
}
h1{font-size:32px;margin:12px 0}
p{color:#b8c9dd;line-height:1.6}
.tag{
 color:#8bc8ff;background:#244b70;
 padding:7px 12px;border-radius:20px;font-size:12px
}
.card{
 background:#14243a;border:1px solid #29415e;
 border-radius:15px;padding:20px;margin-top:18px
}
.option{
 display:block;background:#1b304b;border:1px solid #29415e;
 padding:14px;border-radius:10px;margin-top:10px;
 cursor:pointer
}
.option input{margin-right:10px}
.option:has(input:checked){border-color:#70baff;background:#244b70}
.status{color:#70baff;margin-top:15px}
.error{color:#ff9999}
.success{color:#8be0a4}
button{
 background:#70baff;color:#071525;border:0;
 padding:13px 20px;border-radius:9px;
 font-weight:bold;cursor:pointer;margin-top:16px
}
button:disabled{opacity:.5;cursor:not-allowed}
footer{text-align:center;color:#8295ad;padding:30px}
</style>
</head>

<body>
<header>
<a href="index.html">← Back to SABYDA</a>
<h2>♫ SABYDA</h2>
</header>

<main>
<div class="hero">
<span class="tag">FAN VOTING CENTRE</span>
<h1>🔥 SABYDA Polls</h1>
<p>Your opinion matters. Vote on music, artists, albums and the biggest conversations in entertainment.</p>
</div>

<div id="pollContainer">
<p class="status">Loading polls...</p>
</div>
</main>

<footer>
♫ SABYDA<br>
The Sound of Every Fan.
</footer>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://otmgseddljgeuqetufsm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u18mA3SdsqCNZGW2bavZWA_GrRRs3YG";

const supabase = createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const container = document.getElementById("pollContainer");

function message(text, type="status") {
 container.replaceChildren();
 const p = document.createElement("p");
 p.className = type;
 p.textContent = text;
 container.appendChild(p);
}

function makeText(tag,text,className="") {
 const el = document.createElement(tag);
 el.textContent = text || "";
 if(className) el.className=className;
 return el;
}

async function loadPolls() {
 const {data:{user},error:userError} =
 await supabase.auth.getUser();

 if(userError || !user) {
  message("Please log in or create a SABYDA account before voting.");
  const link=document.createElement("a");
  link.href="auth.html";
  link.textContent="Log in / Sign up";
  link.style.color="#70baff";
  link.style.display="inline-block";
  link.style.marginTop="12px";
  container.appendChild(link);
  return;
 }

 message("Loading polls...");

 const {data:polls,error} = await supabase
  .from("polls")
  .select("id,title,description,status,starts_at,ends_at")
  .eq("status","open")
  .order("created_at",{ascending:false});

 if(error) {
  message("Could not load polls: "+error.message,"error");
  return;
 }

 container.replaceChildren();

 const now=Date.now();

 const activePolls=(polls || []).filter(p =>
  (!p.starts_at || new Date(p.starts_at).getTime()<=now) &&
  (!p.ends_at || new Date(p.ends_at).getTime()>now)
 );

 if(activePolls.length===0) {
  message("There are no active polls right now. Please check back soon.");
  return;
 }

 for(const poll of activePolls) {
  const card=document.createElement("section");
  card.className="card";

  card.appendChild(makeText("span","ACTIVE POLL","tag"));
  card.appendChild(makeText("h2",poll.title));

  if(poll.description) {
   card.appendChild(makeText("p",poll.description));
  }

  const {data:options,error:optionsError} = await supabase
   .from("poll_options")
   .select("id,option_text")
   .eq("poll_id",poll.id)
   .order("created_at",{ascending:true});

  if(optionsError) {
   card.appendChild(makeText("p","Could not load choices: "+optionsError.message,"error"));
   container.appendChild(card);
   continue;
  }

  if(!options || options.length===0) {
   card.appendChild(makeText("p","No choices have been added yet."));
   container.appendChild(card);
   continue;
  }

  const {data:existingVote,error:existingVoteError} = await supabase
   .from("votes")
   .select("id")
   .eq("poll_id",poll.id)
   .eq("user_id",user.id)
   .maybeSingle();

  if(existingVoteError) {
   card.appendChild(makeText("p","Could not check your voting status: "+existingVoteError.message,"error"));
   container.appendChild(card);
   continue;
  }

  if(existingVote) {
   card.appendChild(makeText("p","Poll results will be sent to your notifications after voting closes.","success"));
   container.appendChild(card);
   continue;
  }
  card.appendChild(makeText("p","Choose your preferred option:"));

  const form=document.createElement("form");
  const choices=document.createElement("div");

  for(const option of options) {
   const label=document.createElement("label");
   label.className="option";

   const radio=document.createElement("input");
   radio.type="radio";
   radio.name="poll_"+poll.id;
   radio.value=option.id;
   radio.required=true;

   label.appendChild(radio);
   label.appendChild(document.createTextNode(option.option_text));
   choices.appendChild(label);
  }

  form.appendChild(choices);

  const submit=document.createElement("button");
  submit.type="submit";
  submit.textContent="Submit Vote";
  form.appendChild(submit);

  const feedback=makeText("p","","status");

  form.addEventListener("submit",async(event)=>{
   event.preventDefault();

   const selected=form.querySelector('input[type="radio"]:checked');

   if(!selected) {
    feedback.textContent="Please select an option first.";
    return;
   }

   const confirmed=window.confirm(
    "Are you sure you want to submit this vote?\n\nOnce submitted, you cannot change your vote or vote again in this poll."
   );

   if(!confirmed) return;

   submit.disabled=true;
   feedback.textContent="Submitting your vote...";

   const {error:voteError}=await supabase
    .from("votes")
    .insert({
     poll_id:poll.id,
     option_id:selected.value,
     user_id:user.id,
     voter_key:user.id
    });

    feedback.textContent="Poll results will be sent to your notifications after voting closes.";
     feedback.textContent="Poll results will be sent to your notifications after voting closes.";
    } else {
     feedback.textContent="Vote not submitted: "+voteError.message;
    }
    feedback.className="error";
    submit.disabled=false;
    return;
   }

   feedback.textContent="Your vote has been submitted successfully! You earned 10 activity points.";
   feedback.className="success";
   form.querySelectorAll("input").forEach(input=>input.disabled=true);
   submit.remove();
  });

  card.appendChild(form);
  card.appendChild(feedback);
  container.appendChild(card);
 }
}

loadPolls();
</script>
</body>
</html>
