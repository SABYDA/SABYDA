
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c30">
<title>Music Polls | SABYDA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1424;color:#f4f7fc;
 font-family:Arial,sans-serif
}
header{background:#101c30;padding:20px}
header a{color:#70baff;text-decoration:none}
main{max-width:850px;margin:auto;padding:20px}
.hero{
 background:linear-gradient(135deg,#183c61,#14243a);
 padding:30px 22px;border-radius:18px;margin-top:20px
}
h1{font-size:32px;margin:12px 0}
p{color:#b8c9dd;line-height:1.6}
.tag{
 color:#8bc8ff;background:#244b70;
 padding:7px 12px;border-radius:20px;font-size:12px
}
.card{
 background:#14243a;border:1px solid #29415e;
 border-radius:15px;padding:20px;margin-top:18px
}
.option{
 background:#1b304b;border:1px solid #29415e;
 padding:13px;border-radius:10px;margin-top:10px
}
.status{color:#70baff;margin-top:15px}
.error{color:#ff9999}
footer{text-align:center;color:#8295ad;padding:30px}
</style>
</head>

<body>
<header>
<a href="index.html">← Back to SABYDA</a>
<h2>♫ SABYDA</h2>
</header>

<main>
<div class="hero">
<span class="tag">FAN VOTING CENTRE</span>
<h1>🔥 SABYDA Polls</h1>
<p>Your opinion matters. Vote on music, artists, albums and the biggest conversations in entertainment.</p>
</div>

<div id="pollContainer">
<p class="status">Loading polls...</p>
</div>
</main>

<footer>
♫ SABYDA<br>
The Sound of Every Fan.
</footer>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://otmgseddljgeuqetufsm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_u18mA3SdsqCNZGW2bavZWA_GrRRs3YG";

const supabase = createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const container = document.getElementById("pollContainer");

function showMessage(message, isError = false) {
  container.replaceChildren();
  const p = document.createElement("p");
  p.className = isError ? "status error" : "status";
  p.textContent = message;
  container.appendChild(p);
}

function createText(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text || "";
  if (className) element.className = className;
  return element;
}

async function loadPolls() {
  showMessage("Loading polls...");

  const { data: polls, error: pollError } = await supabase
    .from("polls")
    .select("id,title,description,status,starts_at,end_at")
    .eq("status", "open")
    .order("created_at", { ascending: false });

  if (pollError) {
    showMessage("Database error: " + pollError.message, true);
    console.error(pollError);
    return;
  }

  container.replaceChildren();

  if (!polls || polls.length === 0) {
    showMessage("There are no active polls right now. Please check back soon.");
    return;
  }

  for (const poll of polls) {
    const card = document.createElement("div");
    card.className = "card";

    card.appendChild(createText("span", "ACTIVE POLL", "tag"));
    card.appendChild(createText("h2", poll.title));
    
    if (poll.description) {
      card.appendChild(createText("p", poll.description));
    }

    const optionsBox = document.createElement("div");
    optionsBox.appendChild(createText("p", "Available choices:"));

    const { data: options, error: optionsError } = await supabase
      .from("poll_options")
      .select("id,option_text")
      .eq("poll_id", poll.id)
      .order("creation_at", { ascending: true });

    if (optionsError) {
      optionsBox.appendChild(
        createText("p", "Unable to load choices.", "error")
      );
      console.error(optionsError);
    } else if (!options || options.length === 0) {
      optionsBox.appendChild(
        createText("p", "No choices have been added yet.")
      );
    } else {
      for (const option of options) {
        optionsBox.appendChild(
          createText("div", option.option_text, "option")
        );
      }
    }

    card.appendChild(optionsBox);

    card.appendChild(
      createText(
        "p",
        "Voting will be available after secure voting is configured.",
        "status"
      )
    );

    container.appendChild(card);
  }
}

loadPolls();
</script>
</body>
</html>
