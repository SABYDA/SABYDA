
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABYDA | Public Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #101522;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 520px;
      margin: 30px auto;
      padding: 28px 22px;
      background: #1b2435;
      border-radius: 18px;
      text-align: center;
    }
    .logo { color: #48b9ff; font-size: 25px; font-weight: bold; }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #303c50;
      margin: 25px auto 14px;
      display: block;
    }
    h1 { margin: 10px 0 5px; font-size: 25px; }
    .username { color: #48b9ff; margin: 0 0 18px; }
    .bio {
      color: #d0d7e2;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .section {
      margin-top: 25px;
      padding: 18px;
      background: #263248;
      border-radius: 12px;
      text-align: left;
    }
    .section h2 { font-size: 17px; margin: 0 0 12px; }
    .muted { color: #aeb9ca; font-size: 14px; line-height: 1.5; }
    .edit {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 22px;
      background: #168ee0;
      color: white;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
    }
    #message { color: #c5d1e1; margin-top: 25px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">SABYDA</div>
    <div id="message">Loading profile...</div>

    <div id="profile" hidden>
      <img id="avatar" class="avatar" alt="Profile photo">
      <h1 id="fullName"></h1>
      <p class="username" id="username"></p>
      <p class="bio" id="bio"></p>

      <section class="section">
        <h2>🏆 Activity Points</h2>
        <h1 id="totalPoints">0</h1>
        <p class="muted">Total SABYDA Points</p>

        <div class="points-breakdown">
          <p>🗳️ Polls: <strong id="pollPoints">0</strong> points</p>
          <p>🧠 Quizzes: <strong id="quizPoints">0</strong> points</p>
          <p>👥 Community: <strong id="communityPoints">0</strong> points</p>
          <p>🎵 Other Activities: <strong id="otherPoints">0</strong> points</p>
        </div>
      </section>

      <p class="muted" id="joined"></p>
      <a class="edit" id="editLink" href="edit-profile.html" hidden>
        Edit Profile
      </a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://otmgseddljgeuqetufsm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_u18mA3SdsqCNZGW2bavZWA_GrRRs3YG";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProfile() {
      const message = document.getElementById("message");
      const profileBox = document.getElementById("profile");

      try {
        const params = new URLSearchParams(window.location.search);
        const requestedUsername = params.get("username");

        let query = db.from("profiles").select(
          "id, username, full_name, avatar_url, bio, created_at"
        );

        if (requestedUsername) {
          query = query.eq("username", requestedUsername);
        } else {
          const { data: sessionData } = await db.auth.getSession();
          const user = sessionData.session?.user;

          if (!user) {
            message.textContent =
              "Profile not found. Open a profile link with a username.";
            return;
          }

          query = query.eq("id", user.id);
        }

        const { data: person, error } = await query.maybeSingle();

        if (error) throw error;

        if (!person) {
          message.textContent = "This profile could not be found.";
          return;
        }

        const { data: activityRows, error: activityError } = await db
          .from("profile_activity_points")
          .select("category, points")
          .eq("user_id", person.id);

        if (activityError) throw activityError;

        const pointTotals = {
          polls: 0,
          quizzes: 0,
          community: 0,
          other: 0
        };

        (activityRows || []).forEach(row => {
          if (Object.prototype.hasOwnProperty.call(pointTotals, row.category)) {
            pointTotals[row.category] += Number(row.points) || 0;
          }
        });

        document.getElementById("pollPoints").textContent = pointTotals.polls;
        document.getElementById("quizPoints").textContent = pointTotals.quizzes;
        document.getElementById("communityPoints").textContent = pointTotals.community;
        document.getElementById("otherPoints").textContent = pointTotals.other;

        document.getElementById("totalPoints").textContent =
          Object.values(pointTotals).reduce((sum, points) => sum + points, 0);

        document.getElementById("fullName").textContent =
          person.full_name || "SABYDA Member";

        document.getElementById("username").textContent =
          person.username ? "@" + person.username : "Username not set";

        document.getElementById("bio").textContent =
          person.bio || "No bio added yet.";

        document.getElementById("avatar").src =
          person.avatar_url ||
          "https://placehold.co/200x200/263248/ffffff?text=S";

        if (person.created_at) {
          document.getElementById("joined").textContent =
            "Member since " +
            new Date(person.created_at).toLocaleDateString();
        }

        const { data: sessionData } = await db.auth.getSession();

        if (sessionData.session?.user?.id === person.id) {
          document.getElementById("editLink").hidden = false;
        }

        message.hidden = true;
        profileBox.hidden = false;

      } catch (error) {
        console.error(error);
        message.textContent =
          "Unable to load this profile. Please try again later.";
      }
    }

    loadProfile();
  </script>
</body>
</html>
