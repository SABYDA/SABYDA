
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Top 50 | SABYDA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1424;color:#f4f7fc;
 font-family:Arial,sans-serif
}
header{
 background:#101c30;padding:20px;
 border-bottom:1px solid #293d56
}
header a{color:#70baff;text-decoration:none}
main{max-width:850px;margin:auto;padding:20px}
h1{font-size:30px}
p{color:#a8b9ce;line-height:1.6}
.platform{
 background:#14243a;border:1px solid #293e58;
 border-radius:14px;margin:20px 0;padding:18px
}
.platform h2{font-size:20px;margin:0 0 6px}
.platform-info{font-size:12px;color:#91a9c5}
.empty{
 color:#8da5c0;font-size:13px;
 padding:18px 0
}
footer{
 text-align:center;color:#8295ad;
 padding:25px;font-size:12px
}
</style>
</head>
<body>

<header>
<a href="index.html">← Back to SABYDA</a>
<h2>♫ SABYDA</h2>
</header>

<main>
<h1>🌍 Global Top 50</h1>
<p>Discover the world's top 50 songs across six music platforms.</p>

<div id="charts"></div>
</main>

<footer>
♫ SABYDA — The Sound of Every Fan.
</footer>

<script>
const platforms = [
 {name:"Spotify",icon:"🟢"},
 {name:"Apple Music",icon:"🍎"},
 {name:"Boomplay",icon:"🎧"},
 {name:"YouTube Music",icon:"▶️"},
 {name:"Deezer",icon:"🔵"},
 {name:"Audiomack",icon:"🎵"}
];

const charts = document.getElementById("charts");

platforms.forEach(platform => {
 const section = document.createElement("section");
 section.className = "platform";

 section.innerHTML = `
   <h2>${platform.icon} ${platform.name}</h2>
   <div class="platform-info">GLOBAL WEEKLY TOP 50</div>
   <div class="empty">Chart data will appear here when connected.</div>
 `;

 charts.appendChild(section);
});
</script>

</body>
</html>
